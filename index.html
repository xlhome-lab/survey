<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Survey Kepuasan Pelanggan – XL Home by XLSMART</title>

<!-- Firebase SDK -->
<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
  import { getFirestore, collection, addDoc, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

  // ===== KONFIGURASI FIREBASE – GANTI DENGAN KONFIGURASI ANDA =====
  const firebaseConfig = {
  apiKey: "AIzaSyA0WjQ5Q971uBxwQuzZuo9QpxtOJJjZgsQ",
  authDomain: "xl-home-npsv1.firebaseapp.com",
  projectId: "xl-home-npsv1",
  storageBucket: "xl-home-npsv1.firebasestorage.app",
  messagingSenderId: "726260110586",
  appId: "1:726260110586:web:c433770d1ae4adbc43e543"
  };
  // ================================================================

  const app = initializeApp(firebaseConfig);
  const db = getFirestore(app);

  window._submitSurvey = async function(payload) {
    try {
      await addDoc(collection(db, "nps_responses"), {
        ...payload,
        timestamp: serverTimestamp(),
        submittedAt: new Date().toISOString()
      });
      return true;
    } catch (e) {
      console.error("Error submitting survey:", e);
      return false;
    }
  };
</script>

<style>
  :root {
    --xl-blue: #0050A0;
    --xl-blue-dark: #003A78;
    --xl-blue-light: #1A6CC8;
    --xl-accent: #00AEEF;
    --detractor: #E53935;
    --passive: #FB8C00;
    --promoter: #43A047;
    --bg: #F0F4F8;
    --card-bg: #FFFFFF;
    --text-primary: #1A2B4A;
    --text-secondary: #5A6A7E;
    --border: #D8E2EE;
    --radius: 12px;
    --shadow: 0 8px 32px rgba(0,80,160,0.10);
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
    background: linear-gradient(135deg, #EAF2FB 0%, #F5F8FF 60%, #E8F7FD 100%);
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: flex-start;
    padding: 32px 16px 48px;
  }

  /* ===== TOP BAR (lang switcher) ===== */
  .top-bar {
    width: 100%;
    max-width: 700px;
    display: flex;
    justify-content: flex-end;
    margin-bottom: 12px;
  }
  .lang-switcher {
    display: flex;
    align-items: center;
    background: white;
    border: 1.5px solid var(--border);
    border-radius: 20px;
    padding: 3px;
    gap: 2px;
    box-shadow: 0 2px 8px rgba(0,80,160,0.07);
  }
  .lang-btn {
    padding: 5px 13px;
    border-radius: 16px;
    border: none;
    background: transparent;
    font-size: 12px;
    font-weight: 700;
    color: var(--text-secondary);
    cursor: pointer;
    transition: all 0.18s;
    letter-spacing: 0.3px;
  }
  .lang-btn.active {
    background: var(--xl-blue);
    color: white;
    box-shadow: 0 2px 8px rgba(0,80,160,0.25);
  }
  .lang-btn:hover:not(.active) {
    background: #EEF4FF;
    color: var(--xl-blue);
  }

  /* Brand header */
  .brand-header {
    display: flex;
    align-items: center;
    gap: 14px;
    margin-bottom: 24px;
  }
  .brand-logo-img {
    height: 80px;
    width: auto;
    object-fit: contain;
  }
  .brand-sub {
    display: none;
  }

  /* Customer ID field */
  .custid-field-wrap {
    display: none;
    align-items: center;
    gap: 10px;
    background: white;
    border: 1.5px solid #C5D8F8;
    border-radius: 12px;
    padding: 10px 16px;
    margin-bottom: 20px;
    max-width: 700px;
    width: 100%;
    box-shadow: 0 2px 8px rgba(0,80,160,0.06);
  }
  .custid-field-wrap svg { width: 16px; height: 16px; color: var(--xl-blue); flex-shrink: 0; }
  .custid-field-label {
    font-size: 11px; font-weight: 700; color: var(--text-secondary);
    text-transform: uppercase; letter-spacing: 0.6px; white-space: nowrap;
  }
  .custid-field-input {
    flex: 1;
    border: none; outline: none;
    font-size: 14px; font-weight: 700; color: var(--xl-blue);
    background: transparent;
    cursor: default;
    letter-spacing: 0.3px;
  }
  .custid-field-input:disabled { opacity: 1; -webkit-text-fill-color: var(--xl-blue); }
  .custid-locked-icon {
    width: 14px; height: 14px;
    color: var(--text-secondary);
    opacity: 0.5;
    flex-shrink: 0;
  }

  /* Survey Card */
  .survey-card {
    background: var(--card-bg);
    border-radius: 20px;
    box-shadow: var(--shadow);
    padding: 36px 40px;
    max-width: 700px;
    width: 100%;
    border: 1px solid rgba(0,80,160,0.07);
    position: relative;
    overflow: hidden;
  }
  .survey-card::before {
    content: '';
    position: absolute;
    top: 0; left: 0; right: 0;
    height: 4px;
    background: linear-gradient(90deg, var(--xl-blue) 0%, var(--xl-accent) 100%);
  }

  /* Step dots */
  .step-indicator { display: flex; align-items: center; gap: 8px; margin-bottom: 24px; }
  .step-dot { width: 8px; height: 8px; border-radius: 50%; background: var(--border); transition: all 0.3s; }
  .step-dot.active { background: var(--xl-blue); transform: scale(1.3); }
  .step-dot.done { background: var(--xl-accent); }

  /* NPS question */
  .question-text {
    font-size: 17px; font-weight: 500; color: var(--text-primary);
    line-height: 1.6; margin-bottom: 24px; text-align: center;
  }
  .emoji-container {
    font-size: 56px; height: 68px; text-align: center; margin-bottom: 18px;
    display: flex; align-items: center; justify-content: center;
    transition: transform 0.2s ease;
  }
  .scale-container { display: flex; justify-content: space-between; gap: 5px; margin-bottom: 10px; }
  .score-btn {
    flex: 1; height: 50px; min-width: 0;
    border: 2px solid var(--border); background: #FAFBFD;
    border-radius: 10px; font-size: 17px; font-weight: 700;
    cursor: pointer; transition: all 0.18s ease;
  }
  .score-btn.detractor { color: #E53935; border-color: #FFCDD2; }
  .score-btn.passive   { color: #F59E0B; border-color: #FDE68A; }
  .score-btn.promoter  { color: #43A047; border-color: #C8E6C9; }
  .score-btn:hover { transform: translateY(-3px); box-shadow: 0 4px 12px rgba(0,80,160,0.12); }
  .score-btn.detractor:hover { background: #FFF5F5; border-color: #E53935; }
  .score-btn.passive:hover   { background: #FFFBEB; border-color: #F59E0B; }
  .score-btn.promoter:hover  { background: #F1FFF2; border-color: #43A047; }
  .score-btn.detractor.active { background: var(--detractor); color: white; border-color: var(--detractor); box-shadow: 0 4px 14px rgba(229,57,53,0.35); transform: translateY(-3px) scale(1.05); }
  .score-btn.passive.active   { background: #F59E0B; color: white; border-color: #F59E0B; box-shadow: 0 4px 14px rgba(245,158,11,0.35); transform: translateY(-3px) scale(1.05); }
  .score-btn.promoter.active  { background: var(--promoter); color: white; border-color: var(--promoter); box-shadow: 0 4px 14px rgba(67,160,71,0.35); transform: translateY(-3px) scale(1.05); }
  .scale-labels { display: flex; justify-content: space-between; font-size: 11px; color: var(--text-secondary); margin-top: 8px; }

  /* Response statement after score selection */
  .badge-wrapper { text-align: center; }
  .category-badge {
    display: block;
    max-width: 560px;
    margin: 16px auto 0;
    min-height: 0;
    font-size: 14px;
    line-height: 1.55;
    font-weight: 400;
    color: var(--text-secondary);
    opacity: 0;
    transition: opacity 0.3s;
  }
  .category-badge.visible { opacity: 1; }
  .category-badge.detractor { color: #B42318; }
  .category-badge.passive { color: #A65F00; }
  .category-badge.promoter { color: #287A3A; }

  .validation-message {
    display: none;
    margin: 14px 0 0;
    padding: 10px 12px;
    border-left: 3px solid var(--detractor);
    border-radius: 6px;
    background: #FFF2F1;
    color: #B42318;
    font-size: 13px;
    line-height: 1.45;
  }
  .validation-message.visible { display: block; }

  /* Section divider */
  .divider { height: 1px; background: var(--border); margin: 24px 0; }

  /* ===== REASON SECTION HEADER ===== */
  .reason-section-header {
    margin-bottom: 14px;
  }
  .reason-section-title {
    font-size: 14px;
    font-weight: 700;
    color: var(--text-primary);
    margin-bottom: 8px;
  }
  .reason-counter-row {
    display: flex;
    align-items: center;
    gap: 10px;
  }
  .reason-counter-pill {
    display: inline-flex;
    align-items: center;
    gap: 5px;
    background: #F0F4F8;
    border: 1.5px solid var(--border);
    border-radius: 20px;
    padding: 4px 12px;
    font-size: 12px;
    font-weight: 700;
    color: var(--text-secondary);
    transition: all 0.25s;
  }
  .reason-counter-pill .count-num {
    font-size: 13px;
    font-weight: 800;
    color: var(--xl-blue);
    transition: all 0.2s;
  }
  .reason-counter-pill.has-selection {
    background: #EEF6FF;
    border-color: #A8CCEE;
  }
  .reason-counter-pill.full {
    background: #E8F5E9;
    border-color: #A5D6A7;
  }
  .reason-counter-pill.full .count-num {
    color: #2E7D32;
  }
  .counter-dot {
    width: 5px; height: 5px;
    border-radius: 50%;
    background: var(--border);
    transition: background 0.2s;
  }
  .counter-dot.filled { background: var(--xl-blue); }
  .counter-dot.full-dot { background: #43A047; }

  /* ===== REASON CHIPS ===== */
  .reason-grid {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    margin-bottom: 4px;
  }
  .reason-chip {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    padding: 9px 14px;
    border: 2px solid var(--border);
    border-radius: 24px;
    font-size: 13px;
    font-weight: 500;
    color: var(--text-primary);
    background: #FAFBFD;
    cursor: pointer;
    transition: all 0.18s ease;
    user-select: none;
    line-height: 1.2;
  }
  .reason-chip:hover { border-color: var(--xl-blue-light); background: #F0F6FF; color: var(--xl-blue); }
  .reason-chip.selected {
    background: var(--xl-blue);
    border-color: var(--xl-blue);
    color: white;
    box-shadow: 0 3px 10px rgba(0,80,160,0.25);
  }
  .reason-chip.disabled {
    opacity: 0.45;
    cursor: not-allowed;
    pointer-events: none;
  }
  .reason-chip .chip-icon {
    width: 16px; height: 16px;
    border: 2px solid currentColor;
    border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    flex-shrink: 0;
    font-size: 10px;
    transition: all 0.18s;
  }
  .reason-chip.selected .chip-icon {
    background: white;
    border-color: white;
    color: var(--xl-blue);
  }

  /* ===== SUBREASON PANEL ===== */
  .subreason-panel {
    display: none;
    margin-top: 16px;
    animation: fadeSlideUp 0.35s ease;
  }
  .subreason-panel.visible { display: block; }

  .subreason-group {
    background: #F7FAFF;
    border: 1px solid #D8E8F8;
    border-radius: 14px;
    padding: 16px 18px;
    margin-bottom: 10px;
  }
  .subreason-group-title {
    font-size: 12px;
    font-weight: 700;
    color: var(--xl-blue);
    text-transform: uppercase;
    letter-spacing: 0.5px;
    margin-bottom: 12px;
    display: flex;
    align-items: center;
    gap: 6px;
  }
  .subreason-group-title::before {
    content: '';
    display: inline-block;
    width: 3px; height: 14px;
    background: var(--xl-accent);
    border-radius: 2px;
  }

  /* Sub-counter inside subreason group */
  .sub-counter {
    display: inline-flex;
    align-items: center;
    gap: 4px;
    background: white;
    border: 1.5px solid var(--border);
    border-radius: 14px;
    padding: 3px 10px;
    font-size: 11px;
    font-weight: 700;
    color: var(--text-secondary);
    margin-bottom: 10px;
    transition: all 0.2s;
  }
  .sub-counter .sc-num {
    color: var(--xl-blue);
    font-weight: 800;
    transition: color 0.2s;
  }
  .sub-counter.full { background: #E8F5E9; border-color: #A5D6A7; }
  .sub-counter.full .sc-num { color: #2E7D32; }

  /* Channel chips (CS) */
  .channel-grid {
    display: flex;
    flex-wrap: wrap;
    gap: 7px;
    margin-bottom: 14px;
  }
  .channel-chip {
    padding: 6px 13px;
    border: 2px solid var(--border);
    border-radius: 20px;
    font-size: 12px;
    font-weight: 600;
    color: var(--text-secondary);
    background: white;
    cursor: pointer;
    transition: all 0.18s;
    user-select: none;
  }
  .channel-chip:hover { border-color: var(--xl-accent); color: var(--xl-blue); }
  .channel-chip.selected {
    background: var(--xl-accent);
    border-color: var(--xl-accent);
    color: white;
  }
  .channel-chip.disabled { opacity: 0.4; cursor: not-allowed; pointer-events: none; }

  .channel-label {
    font-size: 11px; font-weight: 700; color: var(--text-secondary);
    text-transform: uppercase; letter-spacing: 0.5px;
    margin-bottom: 8px;
  }
  .cs-reason-label {
    font-size: 11px; font-weight: 700; color: var(--text-secondary);
    text-transform: uppercase; letter-spacing: 0.5px;
    margin: 12px 0 8px;
  }

  /* Freetext */
  .freetext-section { margin-top: 4px; }
  .freetext-section label {
    display: block;
    font-size: 13px; font-weight: 600; color: var(--text-primary);
    margin-bottom: 8px;
  }
  .freetext-section textarea {
    width: 100%; height: 88px;
    padding: 12px 14px;
    border: 2px solid var(--border);
    border-radius: var(--radius);
    resize: none;
    font-family: inherit; font-size: 14px; color: var(--text-primary);
    background: #FAFBFD;
    transition: border-color 0.2s;
    line-height: 1.5;
  }
  .freetext-section textarea:focus { outline: none; border-color: var(--xl-blue-light); background: white; }
  .char-count { text-align: right; font-size: 11px; color: var(--text-secondary); margin-top: 4px; }

  /* Submit */
  .submit-btn {
    margin-top: 24px; width: 100%; padding: 15px;
    background: linear-gradient(135deg, var(--xl-blue) 0%, var(--xl-blue-light) 100%);
    color: white; border: none; border-radius: var(--radius);
    font-size: 15px; font-weight: 700; cursor: pointer;
    letter-spacing: 0.3px; transition: all 0.2s;
    box-shadow: 0 4px 14px rgba(0,80,160,0.30);
    display: none;
  }
  .submit-btn.visible { display: block; }
  .submit-btn:hover { transform: translateY(-2px); box-shadow: 0 6px 20px rgba(0,80,160,0.40); }
  .submit-btn:disabled { opacity: 0.6; cursor: not-allowed; transform: none; }

  /* Thank you */
  .thankyou-screen { display: none; text-align: center; padding: 20px 0; animation: fadeSlideUp 0.5s ease; }
  .thankyou-screen.visible { display: block; }
  .thankyou-icon { font-size: 64px; margin-bottom: 20px; display: block; }
  .thankyou-title { font-size: 24px; font-weight: 700; color: var(--xl-blue); margin-bottom: 12px; }
  .thankyou-msg { font-size: 15px; color: var(--text-secondary); line-height: 1.6; max-width: 380px; margin: 0 auto; }

  /* Footer */
  .survey-footer { margin-top: 20px; text-align: center; font-size: 11px; color: var(--text-secondary); }

  @keyframes fadeSlideUp {
    from { opacity: 0; transform: translateY(12px); }
    to { opacity: 1; transform: translateY(0); }
  }

  @media (max-width: 600px) {
    .survey-card { padding: 24px 18px; }
    .scale-container { gap: 3px; }
    .score-btn { height: 44px; font-size: 15px; border-radius: 8px; }
    .question-text { font-size: 15px; }
    .reason-chip { font-size: 12px; padding: 8px 12px; }
  }
</style>
</head>

let currentLang = 'id';

function setLang(lang) {
  currentLang = lang;
  document.getElementById('btn-id').classList.toggle('active', lang === 'id');
  document.getElementById('btn-en').classList.toggle('active', lang === 'en');
  applyTranslations();
}

function t(key) {
  return I18N[currentLang][key] || I18N['id'][key] || key;
}

function applyTranslations() {
  const strings = I18N[currentLang];

  // NPS question
  const qEl = document.getElementById('nps-question-text');
  if (qEl) qEl.innerHTML = strings.nps_question;

  // data-i18n elements
  document.querySelectorAll('[data-i18n]').forEach(el => {
    const key = el.getAttribute('data-i18n');
    if (strings[key] !== undefined) el.innerHTML = strings[key];
  });

  // data-i18n-placeholder
  document.querySelectorAll('[data-i18n-placeholder]').forEach(el => {
    const key = el.getAttribute('data-i18n-placeholder');
    if (strings[key] !== undefined) el.placeholder = strings[key];
  });

  // Submit button
  const submitBtn = document.getElementById('submit-btn');
  if (submitBtn && !submitBtn.disabled) submitBtn.textContent = strings.submit_btn;

  // Response statement (if visible)
  if (selectedCategory) {
    const badge = document.getElementById('category-badge');
    if (badge) badge.textContent = strings['statement_' + selectedCategory];
    updateDetractorValidationMessage();
  }

  // Re-render reason grid and subreason if visible
  if (document.getElementById('reason-section').style.display !== 'none') {
    renderReasonGrid();
    renderSubreasonSection();
  }
}

function getReasons() { return REASONS[currentLang] || REASONS['id']; }

const MAX_REASONS = 2;
const MAX_SUBREASONS = 2;
const MAX_CHANNELS = 2;

// State
let selectedScore = null;
let selectedCategory = null;
let selectedReasons = [];
let selectedSubreasons = {};
let selectedChannels = {};
let custId = null;

// ===== INIT =====
(function init() {
  const params = new URLSearchParams(window.location.search);
  custId = params.get('custid') || null;
  if (custId) {
    const wrap = document.getElementById('custid-chip');
    wrap.style.display = 'flex';
    const inp = document.getElementById('custid-input');
    if (inp) inp.value = custId;
  }

  // Render NPS buttons
  const container = document.getElementById('scale-buttons');
  for (let i = 0; i <= 10; i++) {
    const btn = document.createElement('button');
    btn.className = 'score-btn';
    btn.textContent = i;
    const cat = i <= 6 ? 'detractor' : i <= 8 ? 'passive' : 'promoter';
    btn.classList.add(cat);
    btn.dataset.score = i;
    btn.dataset.category = cat;
    btn.addEventListener('click', onScoreClick);
    container.appendChild(btn);
  }

  applyTranslations();
  renderReasonGrid();
})();

// ===== NPS SCORE CLICK =====
const npsConfig = {
  detractor: { emoji: '&#128577;' },
  passive:   { emoji: '&#128528;' },
  promoter:  { emoji: '&#128515;' }
};

function onScoreClick() {
  document.querySelectorAll('.score-btn').forEach(b => b.classList.remove('active'));
  this.classList.add('active');
  selectedScore = parseInt(this.dataset.score);
  selectedCategory = this.dataset.category;
  const cfg = npsConfig[selectedCategory];

  const emojiEl = document.getElementById('emoji-display');
  emojiEl.style.transform = 'scale(0.4)';
  setTimeout(() => {
    emojiEl.innerHTML = cfg.emoji;
    emojiEl.style.transform = 'scale(1.2)';
    setTimeout(() => emojiEl.style.transform = 'scale(1)', 150);
  }, 150);

  const badge = document.getElementById('category-badge');
  badge.textContent = t('statement_' + selectedCategory);
  badge.className = `category-badge ${selectedCategory} visible`; 
  updateDetractorValidationMessage();

  const rs = document.getElementById('reason-section');
  rs.style.display = 'block';

  // Hanya Detractor yang melihat subreason dan kolom freetext.
  const isDetractor = selectedCategory === 'detractor';
  document.getElementById('detractor-details').style.display = isDetractor ? 'block' : 'none';
  document.getElementById('subreason-counter-inline').style.display = isDetractor ? 'inline' : 'none';

  // Reset detail Detractor jika responden mengubah skor ke Passive/Promoter.
  if (!isDetractor) {
    selectedSubreasons = {};
    selectedChannels = {};
    document.getElementById('freetext-input').value = '';
    document.getElementById('char-count').textContent = '0';
  }
  renderSubreasonSection();
  updateCounter();

  document.getElementById('dot1').classList.add('done');
  document.getElementById('dot2').classList.add('active');

  setTimeout(() => rs.scrollIntoView({ behavior: 'smooth', block: 'nearest' }), 200);
}

// ===== UPDATE COUNTER =====
function updateDetractorValidationMessage() {
  const validation = document.getElementById('detractor-validation-message');
  if (!validation) return;
  validation.textContent = t('detractor_required');
  validation.classList.toggle('visible', false);
}

function showDetractorValidationMessage() {
  const validation = document.getElementById('detractor-validation-message');
  if (!validation) return;
  validation.textContent = t('detractor_required');
  validation.classList.add('visible');
}

function clearDetractorValidationMessage() {
  const validation = document.getElementById('detractor-validation-message');
  if (validation) validation.classList.remove('visible');
}

function hasDetractorRequiredSelections() {
  const subreasonCount = Object.values(selectedSubreasons).reduce((sum, arr) => sum + arr.length, 0);
  return selectedReasons.length > 0 && subreasonCount > 0;
}

function updateCounter() {
  const rCount = selectedReasons.length;
  const srCount = Object.values(selectedSubreasons).reduce((sum, arr) => sum + arr.length, 0);

  document.getElementById('reason-count').textContent = rCount;
  document.getElementById('subreason-count').textContent = srCount;

  const pill = document.getElementById('reason-counter-pill');
  pill.classList.toggle('has-selection', rCount > 0 && rCount < MAX_REASONS);
  pill.classList.toggle('full', rCount >= MAX_REASONS);

  // Dots
  document.getElementById('rdot1').className = 'counter-dot' + (rCount >= 1 ? (rCount >= MAX_REASONS ? ' full-dot' : ' filled') : '');
  document.getElementById('rdot2').className = 'counter-dot' + (rCount >= 2 ? ' full-dot' : '');
}

// ===== RENDER REASON GRID =====
function renderReasonGrid() {
  const grid = document.getElementById('reason-grid');
  grid.innerHTML = '';
  getReasons().forEach(r => {
    const chip = document.createElement('div');
    chip.className = 'reason-chip' + (selectedReasons.includes(r.id) ? ' selected' : '');
    chip.dataset.id = r.id;
    chip.innerHTML = `<span class="chip-icon">${selectedReasons.includes(r.id) ? '&#10003;' : ''}</span>${r.label}`;
    if (selectedReasons.length >= MAX_REASONS && !selectedReasons.includes(r.id)) {
      chip.classList.add('disabled');
    }
    chip.addEventListener('click', () => toggleReason(r.id));
    grid.appendChild(chip);
  });
}

// ===== TOGGLE REASON =====
function toggleReason(reasonId) {
  if (selectedReasons.includes(reasonId)) {
    selectedReasons = selectedReasons.filter(id => id !== reasonId);
    delete selectedSubreasons[reasonId];
    delete selectedChannels[reasonId];
  } else {
    if (selectedReasons.length >= MAX_REASONS) return;
    selectedReasons.push(reasonId);
    selectedSubreasons[reasonId] = [];
    selectedChannels[reasonId] = [];
  }
  renderReasonGrid();
  renderSubreasonSection();
  updateStepDots();
  updateCounter();
  clearDetractorValidationMessage();
}

// ===== RENDER SUBREASON SECTION =====
function renderSubreasonSection() {
  const panel = document.getElementById('subreason-section');
  if (selectedCategory !== 'detractor') {
    panel.classList.remove('visible');
    panel.innerHTML = '';
    return;
  }
  if (selectedReasons.length === 0) {
    panel.classList.remove('visible');
    panel.innerHTML = '';
    return;
  }

  panel.classList.add('visible');
  panel.innerHTML = '';

  selectedReasons.forEach(reasonId => {
    const reason = getReasons().find(r => r.id === reasonId);
    if (!reason) return;

    const group = document.createElement('div');
    group.className = 'subreason-group';

    const title = document.createElement('div');
    title.className = 'subreason-group-title';
    title.textContent = reason.label;
    group.appendChild(title);

    // Sub-counter
    const selSub = selectedSubreasons[reasonId] || [];
    const subCounter = document.createElement('div');
    subCounter.className = 'sub-counter' + (selSub.length >= MAX_SUBREASONS ? ' full' : '');
    subCounter.innerHTML = `<span class="sc-num">${selSub.length}</span>/2 sub reason`;
    group.appendChild(subCounter);

    // Channel selector (CS only)
    if (reason.hasChannel) {
      const chanLabel = document.createElement('div');
      chanLabel.className = 'channel-label';
      chanLabel.textContent = t('channel_label');
      group.appendChild(chanLabel);

      const chanGrid = document.createElement('div');
      chanGrid.className = 'channel-grid';
      reason.channels.forEach(ch => {
        const chip = document.createElement('div');
        const selCh = selectedChannels[reasonId] || [];
        chip.className = 'channel-chip' + (selCh.includes(ch) ? ' selected' : '');
        if (selCh.length >= MAX_CHANNELS && !selCh.includes(ch)) chip.classList.add('disabled');
        chip.textContent = ch;
        chip.addEventListener('click', () => toggleChannel(reasonId, ch));
        chanGrid.appendChild(chip);
      });
      group.appendChild(chanGrid);

      const reasonLabel = document.createElement('div');
      reasonLabel.className = 'cs-reason-label';
      reasonLabel.textContent = t('cs_reason_label');
      group.appendChild(reasonLabel);
    } else {
      const subLabel = document.createElement('div');
      subLabel.className = 'channel-label';
      subLabel.textContent = t('subreason_specific');
      group.appendChild(subLabel);
    }

    // Subreason chips
    const subGrid = document.createElement('div');
    subGrid.className = 'reason-grid';
    reason.subreasons.forEach(sr => {
      const chip = document.createElement('div');
      chip.className = 'reason-chip' + (selSub.includes(sr.id) ? ' selected' : '');
      if (selSub.length >= MAX_SUBREASONS && !selSub.includes(sr.id)) chip.classList.add('disabled');
      chip.dataset.id = sr.id;
      chip.innerHTML = `<span class="chip-icon">${selSub.includes(sr.id) ? '&#10003;' : ''}</span>${sr.label}`;
      chip.addEventListener('click', () => toggleSubreason(reasonId, sr.id));
      subGrid.appendChild(chip);
    });
    group.appendChild(subGrid);
    panel.appendChild(group);
  });
}

// ===== TOGGLE SUBREASON =====
function toggleSubreason(reasonId, subId) {
  const arr = selectedSubreasons[reasonId] || [];
  if (arr.includes(subId)) {
    selectedSubreasons[reasonId] = arr.filter(id => id !== subId);
  } else {
    if (arr.length >= MAX_SUBREASONS) return;
    selectedSubreasons[reasonId] = [...arr, subId];
  }
  renderSubreasonSection();
  updateStepDots();
  updateCounter();
  clearDetractorValidationMessage();
}

// ===== TOGGLE CHANNEL =====
function toggleChannel(reasonId, ch) {
  const arr = selectedChannels[reasonId] || [];
  if (arr.includes(ch)) {
    selectedChannels[reasonId] = arr.filter(c => c !== ch);
  } else {
    if (arr.length >= MAX_CHANNELS) return;
    selectedChannels[reasonId] = [...arr, ch];
  }
  renderSubreasonSection();
}

// ===== STEP DOTS =====
function updateStepDots() {
  if (selectedReasons.length > 0) {
    document.getElementById('dot2').classList.add('done');
    document.getElementById('dot3').classList.add('active');
  } else {
    document.getElementById('dot2').classList.remove('done');
    document.getElementById('dot3').classList.remove('active');
  }
}

// ===== CHAR COUNT =====
function updateCharCount() {
  document.getElementById('char-count').textContent = document.getElementById('freetext-input').value.length;
}

// ===== SUBMIT =====
async function submitSurvey() {
  if (selectedScore === null) return;

  if (selectedCategory === 'detractor' && !hasDetractorRequiredSelections()) {
    showDetractorValidationMessage();
    document.getElementById('detractor-validation-message').scrollIntoView({ behavior: 'smooth', block: 'center' });
    return;
  }

  const btn = document.getElementById('submit-btn');
  btn.disabled = true;
  btn.textContent = t('submitting');

  const reasonsPayload = selectedReasons.map(rid => {
    const r = getReasons().find(x => x.id === rid);
    const entry = {
      reasonId: rid,
      reasonLabel: r ? r.label : rid,
      subreasons: (selectedSubreasons[rid] || []).map(sid => {
        const sr = r ? r.subreasons.find(x => x.id === sid) : null;
        return { id: sid, label: sr ? sr.label : sid };
      })
    };
    if (r && r.hasChannel) {
      entry.channels = selectedChannels[rid] || [];
    }
    return entry;
  });

  const payload = {
    score: selectedScore,
    category: selectedCategory,
    reasons: reasonsPayload,
    freetext: selectedCategory === 'detractor' ? document.getElementById('freetext-input').value.trim() : '',
    custId: custId || null,
    lang: currentLang,
    userAgent: navigator.userAgent
  };

  let success = false;
  if (typeof window._submitSurvey === 'function') {
    success = await window._submitSurvey(payload);
  } else {
    await new Promise(r => setTimeout(r, 800));
    success = true;
  }

  if (success) {
    document.getElementById('dot3').classList.add('done');
    document.getElementById('dot4').classList.add('active');
    document.getElementById('survey-form').style.display = 'none';
    document.getElementById('thankyou-screen').classList.add('visible');
    applyTranslations();
  } else {
    btn.disabled = false;
    btn.textContent = t('submit_btn');
    alert(t('error_msg'));
  }
}
</script>
